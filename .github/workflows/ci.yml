name: CI - Build Windows & Linux

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  audit:
    name: Facade & License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check public headers for leaked private includes
        run: |
          if grep -rnE '#include.*(raylib|raygui|json\.hpp|windows\.h)' include/AsciiEngine/; then
            echo "ERROR: Un header publico esta filtrando una dependencia privada."
            exit 1
          fi
          echo "OK: Encapsulamiento Facade intacto."

      - name: Check SPDX Zlib license headers
        run: |
          MISSING=0
          for f in $(find include/AsciiEngine src sandbox -type f \( -name "*.hpp" -o -name "*.cpp" \)); do
            if ! grep -q "SPDX-License-Identifier: Zlib" "$f"; then
              echo "Falta encabezado SPDX Zlib en: $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi
          echo "OK: Todos los archivos fuente declaran licencia Zlib."

  build:
    name: Build (${{ matrix.os }})
    needs: audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Raylib system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxcursor-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build AsciiEngine & Sandbox
        run: cmake --build build --config Release --parallel

      - name: Verify Sandbox binary exists
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f build/Release/Sandbox.exe || test -f build/Sandbox.exe
          else
            test -f build/Sandbox
          fi